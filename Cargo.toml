[workspace]
resolver = "2"
members = [
    "crates/vnet-crypto",
    "crates/vnet-proto",
    "crates/vnet-nat",
    "crates/vnet-tun",
    "crates/vnet-core",
    "crates/vnet-ipc",
    "crates/vnet-cli",
    "crates/vnet-tui",
    "crates/vnet-gui",
]

[workspace.dependencies]
# Crypto
aes-gcm = { version = "0.10", features = ["aes"] }
chacha20poly1305 = "0.10"
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa", "arithmetic"] }
k256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa", "arithmetic"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = { version = "0.8", features = ["std", "getrandom"] }
getrandom = { version = "0.2", features = ["std"] }
zeroize = { version = "1.6", features = ["zeroize_derive"] }
subtle = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "1.3" }
bytes = "1.5"
bitflags = "2.5"

# Async
tokio = { version = "1.38", features = ["full", "tracing"] }
async-trait = "0.1"
futures = "0.3"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Config
config = { version = "0.13", features = ["toml"] }
toml = "0.8"
dirs = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env", "std"] }
ratatui = { version = "0.27", features = ["crossterm"] }
crossterm = { version = "0.27", features = ["use-dev-tty"] }

# GUI
egui = { version = "0.28", features = ["default", "persistence", "serde"] }
eframe = { version = "0.28", features = ["default", "wgpu", "persistence"] }

# Network
socket2 = "0.5"
ipnetwork = "0.21"

# IPC
jsonrpsee = { version = "0.26", features = ["server", "client", "tokio", "http-client"] }

# TUN
wintun = { version = "0.5" }

# STUN/TURN/ICE
stun = "0.5"
turn = "0.5"

# Testing
proptest = { version = "1.0", features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 2
opt-level = 0
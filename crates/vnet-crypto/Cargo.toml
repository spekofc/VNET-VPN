[package]
name = "vnet-crypto"
version = "0.1.0"
edition = "2021"
description = "Crypto primitives for vnet protocol (AES-GCM, ChaCha20-Poly1305, ECDH, HKDF)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vnet/vnet"

[dependencies]
aes-gcm = { workspace = true, features = ["aes", "zeroize"] }
chacha20poly1305 = { workspace = true }
p256 = { workspace = true, features = ["pkcs8", "pem", "ecdsa", "arithmetic", "ecdh"] }
k256 = { workspace = true, features = ["pkcs8", "pem", "ecdsa", "arithmetic"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
generic-array = "0.14"
pem = "1.0"
pbkdf2 = "0.13"

[dev-dependencies]
proptest = { workspace = true }
hex = "0.4"